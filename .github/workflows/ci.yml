name: EJII Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ejii-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-regression:
    name: Quality and Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run code quality and type checks
        run: npm run lint

      - name: Run core intelligence and memory unit tests
        run: node --test --test-concurrency=1 src/core/__tests__/*.test.js

      - name: Run complete EJII regression suite
        run: npm test
