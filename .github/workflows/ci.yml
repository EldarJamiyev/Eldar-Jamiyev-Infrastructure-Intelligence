name: EJII Sovereign Infrastructure Intelligence CI

on:
  push:
    branches:
      - main
      - ai-studio-sync
  pull_request:
    branches:
      - main
      - ai-studio-sync

jobs:
  verify-and-test:
    name: Lint, Typecheck, TS/JS Parity & Isolated Test Suites
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Syntax, HTML/CSS & Integrity Linter
        run: npm run lint

      - name: Run TypeScript Compiler Verification
        run: npx tsc --noEmit

      - name: Verify 100% TypeScript / JavaScript Dual-Maintenance Parity
        run: npm run verify:parity

      - name: Execute Authoritative Isolated Test Suites
        run: npm test
