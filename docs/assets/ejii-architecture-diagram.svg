<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="EJII v7.0 System Architecture Diagram">
  <defs>
    <style>
      .title { font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif; font-weight: 800; fill: #0F172A; }
      .subtitle { font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif; font-weight: 500; fill: #475569; }
      .layer-label { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 11px; letter-spacing: 0.08em; fill: #2563EB; }
      .box-title { font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 13.5px; fill: #0F172A; }
      .box-meta { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 11px; fill: #475569; }
      .pill-text { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 10px; fill: #FFFFFF; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1200" height="540" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Header -->
  <text x="36" y="42" class="title" font-size="20">EJII v7.0 — End-to-End Sovereign Infrastructure Intelligence Architecture</text>
  <text x="36" y="64" class="subtitle" font-size="13">Project Aurora Unified UI Shell · Project Falcon AI-Native Conversational Brain · Sovereign Fabric v6 Evidence &amp; Governance Plane</text>

  <!-- TIER 1: Unified Frontend Workstations -->
  <rect x="28" y="84" width="1144" height="106" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="46" y="106" class="layer-label">TIER 1 · PROJECT AURORA UNIFIED FRONTEND WORKSTATIONS (PUBLIC/JS/VIEWS/* + EJII-MERIDIAN.CSS)</text>

  <g transform="translate(46, 118)">
    <rect x="0" y="0" width="172" height="56" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="12" y="22" class="box-title">AI Assistant &amp; Chat</text>
    <text x="12" y="40" class="box-meta">chat-workspace-view.js</text>

    <rect x="184" y="0" width="172" height="56" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="196" y="22" class="box-title">AI Operator Console</text>
    <text x="196" y="40" class="box-meta">ai-operator-view.js</text>

    <rect x="368" y="0" width="172" height="56" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="380" y="22" class="box-title">Topology &amp; NOC Map</text>
    <text x="380" y="40" class="box-meta">topology / noc-view.js</text>

    <rect x="552" y="0" width="172" height="56" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="564" y="22" class="box-title">3-Pane Wire Sniffer</text>
    <text x="564" y="40" class="box-meta">sniffer-view.js</text>

    <rect x="736" y="0" width="172" height="56" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="748" y="22" class="box-title">IP Scanner &amp; Host</text>
    <text x="748" y="40" class="box-meta">ultra-ip / pc-auto</text>

    <rect x="920" y="0" width="188" height="56" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="932" y="22" class="box-title">Diagnostics &amp; Academy</text>
    <text x="932" y="40" class="box-meta">core-diag / learning</text>
  </g>

  <!-- Connector Arrows Tier 1 -> Tier 2 -->
  <line x1="300" y1="190" x2="300" y2="214" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="190" x2="600" y2="214" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="900" y1="190" x2="900" y2="214" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

