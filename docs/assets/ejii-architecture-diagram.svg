  <rect x="28" y="218" width="1144" height="132" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="46" y="240" class="layer-label">TIER 2 · PROJECT FALCON AI CONVERSATIONAL BRAIN &amp; SOVEREIGN INTELLIGENCE FABRIC V6 (SRC/CORE/*)</text>

  <g transform="translate(46, 252)">
    <rect x="0" y="0" width="356" height="82" rx="10" fill="#0F172A"/>
    <rect x="14" y="12" width="110" height="18" rx="4" fill="#2563EB"/>
    <text x="69" y="24" text-anchor="middle" class="pill-text">GEMINI + BRAIN</text>
    <text x="14" y="46" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14">Conversational Brain &amp; Semantic Interpreter</text>
    <text x="14" y="66" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">Multi-turn context · Mail/ISP workflows · Zero-guess</text>

    <rect x="376" y="0" width="356" height="82" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
    <rect x="390" y="12" width="128" height="18" rx="4" fill="#059669"/>
    <text x="454" y="24" text-anchor="middle" class="pill-text">EPISTEMIC GUARDRAIL</text>
    <text x="390" y="46" class="box-title">Evidence Fabric &amp; Causal RCA Correlator</text>
    <text x="390" y="66" class="box-meta">11 Evidence Classes · Lineage DAG · Shannon Gain</text>

    <rect x="752" y="0" width="356" height="82" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
    <rect x="766" y="12" width="142" height="18" rx="4" fill="#D97706"/>
    <text x="837" y="24" text-anchor="middle" class="pill-text">GOVERNED REMEDIATION</text>
    <text x="766" y="46" class="box-title">Autonomous Operator &amp; Honest Rollback</text>
    <text x="766" y="66" class="box-meta">Pre-Snapshots · Postcondition Probe · Auto-Restore</text>
  </g>

  <!-- Connector Arrows Tier 2 -> Tier 3 -->
  <line x1="300" y1="350" x2="300" y2="374" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="350" x2="600" y2="374" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="900" y1="350" x2="900" y2="374" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- TIER 3: Live Protocol Engines, OS Collectors & SQLite WAL Persistence -->
  <rect x="28" y="378" width="1144" height="134" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="46" y="400" class="layer-label">TIER 3 · LIVE PROTOCOL DISSECTORS, OS TELEMETRY COLLECTORS &amp; SQLITE WAL STORAGE (SRC/PROTOCOLS &amp; SRC/DB)</text>

  <g transform="translate(46, 412)">
    <rect x="0" y="0" width="266" height="82" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="14" y="24" class="box-title">5-Layer Local-to-ISP Probes</text>
    <text x="14" y="44" class="box-meta">NIC/DHCP · Gateway · DNS · TCP · HTTP</text>
    <text x="14" y="62" class="box-meta">Verified OS Resolver Discovery</text>

    <rect x="280" y="0" width="266" height="82" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="294" y="24" class="box-title">L2–L7 Wire &amp; Socket Engine</text>
    <text x="294" y="44" class="box-meta">RFC Binary Dissector · JA4 TLS 1.3</text>
    <text x="294" y="62" class="box-meta">Kernel BPF &amp; Wireshark AST Filter</text>

    <rect x="560" y="0" width="266" height="82" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="574" y="24" class="box-title">Host &amp; Fleet Telemetry</text>
    <text x="574" y="44" class="box-meta">CPU/RAM/Disk · Active Kernel Sockets</text>
    <text x="574" y="62" class="box-meta">28 Audited Remediation Recipes</text>

    <rect x="840" y="0" width="268" height="82" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="854" y="24" class="box-title">SQLite WAL &amp; RBAC Security</text>
    <text x="854" y="44" class="box-meta">PBKDF2-SHA512 · Capability JWTs</text>
    <text x="854" y="62" class="box-meta">Session Ownership &amp; DVR Snapshots</text>
  </g>
</svg>
