<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" role="img" aria-labelledby="title desc">
  <title id="title">EJII — Infrastructure Intelligence</title>
  <desc id="desc">A dark technical banner showing connected infrastructure nodes and the Observe, Correlate, Investigate, Govern workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071321"/>
      <stop offset="0.55" stop-color="#0B1D31"/>
      <stop offset="1" stop-color="#102B43"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity=".12"/>
      <stop offset=".5" stop-color="#67E8F9" stop-opacity=".95"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#6B91B4" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1440" height="420" rx="24" fill="url(#grid)"/>
  <circle cx="1250" cy="205" r="250" fill="#0EA5E9" opacity=".055"/>
  <circle cx="1250" cy="205" r="180" fill="none" stroke="#38BDF8" stroke-opacity=".12"/>
  <circle cx="1250" cy="205" r="115" fill="none" stroke="#38BDF8" stroke-opacity=".14"/>
  <g stroke="url(#line)" stroke-width="2" fill="none" opacity=".9">
    <path d="M920 88L1040 142L1154 88L1276 147L1370 94"/>
    <path d="M920 88L965 214L1084 266L1154 88"/>
    <path d="M1040 142L1084 266L1236 320L1370 236"/>
    <path d="M1154 88L1276 147L1370 236"/>
    <path d="M965 214L1032 350L1236 320"/>
    <path d="M1276 147L1322 42"/>
  </g>
  <g fill="#0B2035" stroke="#67E8F9" stroke-width="2" filter="url(#glow)">
