  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="88" y="102" fill="#8CB5D5" font-size="17" font-weight="700" letter-spacing="4">ELDAR JAMIYEV'S</text>
    <text x="84" y="184" fill="#F2F8FC" font-size="66" font-weight="750" letter-spacing="-2">Infrastructure</text>
    <text x="84" y="255" fill="url(#accent)" font-size="66" font-weight="750" letter-spacing="-2">Intelligence</text>
