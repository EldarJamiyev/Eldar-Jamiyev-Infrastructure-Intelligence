  </defs>

  <!-- Canvas -->
  <rect width="1280" height="380" rx="18" fill="url(#bgGrad)"/>
  <rect width="1280" height="380" rx="18" fill="url(#archGrid)"/>
  <rect width="1280" height="380" rx="18" fill="url(#glowBlue)"/>
  <rect width="1280" height="380" rx="18" fill="url(#glowEmerald)"/>
  <rect x="1" y="1" width="1278" height="378" rx="17" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Left Column: Brand Identity & Positioning -->
  <g transform="translate(56, 48)">
    <!-- Monogram & Eyebrow -->
    <rect x="0" y="0" width="52" height="52" rx="13" fill="url(#badgeGrad)"/>
    <text x="26" y="32" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="16" font-weight="800" letter-spacing="0.06em">EJII</text>

    <rect x="68" y="6" width="286" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="82" cy="18" r="4" fill="#10B981"/>
    <text x="94" y="22" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="0.08em">SOVEREIGN INFRASTRUCTURE AI · v7.0</text>

    <text x="68" y="46" fill="#94A3B8" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="0.02em">Eldar Jamiyev&apos;s Infrastructure Intelligence Platform</text>

    <!-- Main Headline -->
    <text x="0" y="106" fill="#F8FAFC" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.03em">AI-Native Network, Protocol &amp;</text>
    <text x="0" y="150" fill="#F8FAFC" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.03em">Host Diagnostic Workbench</text>

    <!-- Subtitle -->
    <text x="0" y="186" fill="#CBD5E1" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="15" font-weight="400">
