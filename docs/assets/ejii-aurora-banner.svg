      <text x="14" y="198" fill="#93C5FD" font-size="10" font-weight="700">AI BRAIN ROOT-CAUSE VERDICT</text>
      <text x="14" y="215" fill="#F8FAFC" font-size="11" font-weight="500">Transport &amp; DNS healthy · Epistemic Q=0.85</text>
    </g>
