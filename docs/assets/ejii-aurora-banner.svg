      <circle cx="16" cy="18" r="4" fill="#34D399"/>
      <text x="30" y="22" fill="#E2E8F0" font-weight="600">L1/L2 NIC &amp; DHCP</text>
      <text x="338" y="22" text-anchor="end" fill="#34D399" font-weight="700">eth0 · UP</text>

      <rect x="0" y="44" width="352" height="36" rx="7" fill="#0F172A" stroke="#1E293B"/>
      <circle cx="16" cy="62" r="4" fill="#34D399"/>
      <text x="30" y="66" fill="#E2E8F0" font-weight="600">L3 Default Gateway</text>
      <text x="338" y="66" text-anchor="end" fill="#38BDF8" font-weight="700">0.84 ms RTT</text>

      <rect x="0" y="88" width="352" height="36" rx="7" fill="#0F172A" stroke="#1E293B"/>
      <circle cx="16" cy="106" r="4" fill="#34D399"/>
      <text x="30" y="110" fill="#E2E8F0" font-weight="600">L4 TCP Handshake</text>
      <text x="338" y="110" text-anchor="end" fill="#34D399" font-weight="700">OPEN · 1.75 ms</text>

      <rect x="0" y="132" width="352" height="36" rx="7" fill="#0F172A" stroke="#1E293B"/>
      <circle cx="16" cy="150" r="4" fill="#34D399"/>
