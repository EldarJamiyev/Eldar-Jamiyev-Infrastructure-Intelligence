    <circle cx="20" cy="20" r="4.5" fill="#EF4444"/>
    <circle cx="34" cy="20" r="4.5" fill="#F59E0B"/>
    <circle cx="48" cy="20" r="4.5" fill="#10B981"/>
    <text x="70" y="24" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">ejii://sovereign-fabric/live-probe</text>
