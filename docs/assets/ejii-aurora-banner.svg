      <text x="16" y="22" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="0.06em">VERIFIED SUITES</text>
      <text x="16" y="42" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800">100 / 100 PASS</text>

      <rect x="182" y="0" width="176" height="54" rx="10" fill="#0F172A" fill-opacity="0.82" stroke="#334155" stroke-width="1"/>
      <text x="198" y="22" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="0.06em">PROTOCOL PROBES</text>
      <text x="198" y="42" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800">DNS·TCP·TLS·HTTP</text>

      <rect x="372" y="0" width="176" height="54" rx="10" fill="#0F172A" fill-opacity="0.82" stroke="#334155" stroke-width="1"/>
      <text x="388" y="22" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="0.06em">EPISTEMIC ENGINE</text>
      <text x="388" y="42" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800">Zero Fabrication</text>

      <rect x="562" y="0" width="176" height="54" rx="10" fill="#0F172A" fill-opacity="0.82" stroke="#334155" stroke-width="1"/>
      <text x="578" y="22" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="0.06em">CORE WORKSTATIONS</text>
      <text x="578" y="42" fill="#A78BFA" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800">9 Unified Views</text>
